<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LDC 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --ob: #2563EB; --ob-light: #DBEAFE; --ob-dark: #1E40AF;
  --rv: #059669; --rv-light: #D1FAE5; --rv-dark: #065F46;
  --sr: #7C3AED; --sr-light: #EDE9FE; --sr-dark: #5B21B6;
  --dc: #DC2626; --dc-light: #FEE2E2; --dc-dark: #991B1B;
  --bg:      #1A0F0A;
  --bg2:     #22140D;
  --surface: #2C1A10;
  --surface2:#38211A;
  --border:  rgba(255,180,80,0.12);
  --border2: rgba(255,180,80,0.22);
  --text:    #FDF0E0;
  --muted:   #A07860;
  --ember:   #F97316;
  --gold:    #F59E0B;
  --flame:   #EF4444;
  --accent:  #F97316;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}

/* flame bg */
#splash,#admin-login,#group-pick{background:var(--bg);background-image:radial-gradient(ellipse 60% 40% at 50% 100%,rgba(249,115,22,.22) 0%,transparent 70%),radial-gradient(ellipse 30% 20% at 30% 90%,rgba(239,68,68,.12) 0%,transparent 60%),radial-gradient(ellipse 30% 20% at 70% 88%,rgba(245,158,11,.10) 0%,transparent 60%);}

/* SPLASH */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:10px;}
.splash-fire{font-size:52px;margin-bottom:4px;filter:drop-shadow(0 0 24px rgba(249,115,22,.7));animation:flicker 2.5s ease-in-out infinite;}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-1deg);filter:drop-shadow(0 0 20px rgba(249,115,22,.7))}50%{transform:scale(1.06) rotate(1deg);filter:drop-shadow(0 0 36px rgba(249,115,22,1));}}
.splash-title{font-family:'Syne',sans-serif;font-size:clamp(52px,12vw,100px);font-weight:800;letter-spacing:-3px;background:linear-gradient(135deg,#FDE68A 0%,#F97316 50%,#EF4444 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.splash-sub{font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}
.splash-btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;justify-content:center;}
.splash-btn{padding:14px 28px;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;border:none;transition:transform .15s,opacity .15s;}
.splash-btn:hover{transform:translateY(-2px);opacity:.92;}
.btn-leader{background:linear-gradient(135deg,#F97316,#EF4444);color:#fff;box-shadow:0 4px 20px rgba(249,115,22,.4);}
.btn-admin{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}

/* LOGIN */
#admin-login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:99;}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:40px;width:340px;}
.login-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
.login-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;margin-bottom:14px;outline:none;}
.login-input:focus{border-color:var(--ember);}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#F97316,#EF4444);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.login-btn:hover{opacity:.88;}
.login-err{font-size:12px;color:#F87171;margin-top:10px;display:none;}
.back-link{font-size:13px;color:var(--muted);cursor:pointer;margin-top:16px;display:inline-block;}
.back-link:hover{color:var(--text);}

/* GROUP PICK */
#group-pick{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:98;gap:14px;padding:24px;}
.pick-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;text-align:center;}
.pick-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px;}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px;}
.pick-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:22px 18px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:center;}
.pick-card:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(249,115,22,.2);border-color:var(--ember);}
.pick-dot{width:40px;height:40px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.pick-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:600;}

/* APP */
#app{display:none;height:100vh;flex-direction:column;}
.topbar{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border2);background:var(--surface);gap:10px;flex-shrink:0;}
.topbar-logo{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;background:linear-gradient(135deg,#FDE68A,#F97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.topbar-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.topbar-pts{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;}
.notif-bell{position:relative;cursor:pointer;margin-left:auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border2);background:var(--surface2);font-size:16px;flex-shrink:0;}
.notif-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:2px solid var(--surface);display:none;}
.notif-dot.show{display:block;}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border2);background:var(--surface);flex-shrink:0;overflow-x:auto;}
.tab{flex:1;min-width:60px;padding:11px 4px;text-align:center;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;letter-spacing:.3px;text-transform:uppercase;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--ember);border-bottom-color:var(--ember);}

/* PAGES */
.pages{flex:1;overflow-y:auto;padding:16px 14px;}
.page{display:none;}
.page.active{display:block;animation:fadeUp .2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.sec{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;margin-top:4px;display:flex;align-items:center;gap:8px;}
.sec::after{content:'';flex:1;height:1px;background:var(--border2);}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
.stat-box{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:14px 10px;text-align:center;}
.stat-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

.grp-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.grp-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;flex-shrink:0;}
.grp-name{flex:1;font-size:13px;font-weight:500;}
.grp-bar-wrap{flex:2;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.grp-bar{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.grp-pts{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;min-width:58px;text-align:right;}

.lb-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.lb-row.me{border-color:var(--ember);box-shadow:0 0 12px rgba(249,115,22,.15);}
.lb-rank{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;min-width:26px;}
.lb-name{flex:1;font-size:13px;font-weight:500;}
.lb-pts{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}

/* STORE */
.store-header{background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(239,68,68,.08));border:1px solid var(--border2);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.store-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
.s-emoji{font-size:28px;margin-bottom:8px;display:block;}
.s-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;margin-bottom:3px;}
.s-desc{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
.s-footer{display:flex;align-items:center;justify-content:space-between;}
.s-pts{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--gold);}
.s-btn{font-size:11px;padding:6px 12px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .12s;}
.s-btn:hover{background:var(--surface2);}
.s-btn:disabled{opacity:.3;cursor:default;}

/* HISTORY */
.tx-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:9px;}
.tx-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.tx-plus{background:rgba(16,185,129,.15);}
.tx-minus{background:rgba(239,68,68,.15);}
.tx-body{flex:1;}
.tx-desc{font-size:12px;font-weight:500;}
.tx-grp{font-size:10px;color:var(--muted);margin-top:1px;}
.tx-amt{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.tx-time{font-size:10px;color:var(--muted);}

/* ADMIN */
.admin-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:16px;margin-bottom:12px;}
.admin-card-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:12px;color:var(--gold);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.form-field{display:flex;flex-direction:column;gap:4px;}
.form-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.form-input,.form-select{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;width:100%;}
.form-input:focus,.form-select:focus{border-color:var(--ember);}
.form-select option{background:var(--surface2);}
.log-btn{width:100%;margin-top:4px;padding:12px;background:linear-gradient(135deg,#F97316,#EF4444);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s;box-shadow:0 3px 14px rgba(249,115,22,.3);}
.log-btn:hover{opacity:.87;}

/* STORE MANAGER */
.sm-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:9px;}
.sm-emoji{font-size:20px;flex-shrink:0;}
.sm-body{flex:1;}
.sm-name{font-size:12px;font-weight:600;}
.sm-meta{font-size:10px;color:var(--muted);margin-top:1px;}
.sm-pts{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0;}
.sm-del{background:transparent;border:1px solid rgba(239,68,68,.3);color:#EF4444;border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0;}
.sm-del:hover{background:rgba(239,68,68,.1);}

/* BIDDING */
.bid-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.bid-item.active-bid{border-color:var(--gold);box-shadow:0 0 18px rgba(245,158,11,.18);}
.bid-item.ended{opacity:.75;}
.bid-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bid-emoji{font-size:26px;flex-shrink:0;}
.bid-info{flex:1;}
.bid-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.bid-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.bid-status{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0;}
.bid-active{background:rgba(245,158,11,.18);color:var(--gold);}
.bid-ended{background:rgba(239,68,68,.15);color:#F87171;}
.bid-timer{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--gold);margin-bottom:10px;letter-spacing:1px;}
.bid-bids-list{margin-bottom:10px;}
.bid-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--surface2);margin-bottom:4px;}
.bid-row.leading{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);}
.bid-grp-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;}
.bid-grp-name{flex:1;font-size:12px;font-weight:500;}
.bid-grp-pts{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.bid-input-row{display:flex;gap:8px;align-items:center;}
.bid-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.bid-input:focus{border-color:var(--gold);}
.bid-submit{padding:9px 14px;background:linear-gradient(135deg,#F59E0B,#F97316);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.bid-submit:disabled{opacity:.35;cursor:default;}
.bid-winner-banner{background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(249,115,22,.1));border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--gold);margin-bottom:8px;}
.bid-hint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5;}

/* NOTIF PANEL */
#notif-panel{position:fixed;top:0;right:-330px;width:310px;height:100vh;background:var(--surface);border-left:1px solid var(--border2);z-index:200;display:flex;flex-direction:column;transition:right .25s cubic-bezier(.4,0,.2,1);}
#notif-panel.open{right:0;}
.notif-header{padding:16px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.notif-header-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--gold);}
.notif-close{cursor:pointer;color:var(--muted);font-size:20px;}
.notif-close:hover{color:var(--text);}
.notif-list{flex:1;overflow-y:auto;padding:10px;}
.notif-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:7px;}
.notif-item.unread{border-color:var(--gold);}
.notif-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.notif-group{font-size:11px;font-weight:700;}
.notif-time{font-size:10px;color:var(--muted);}
.notif-item-body{font-size:12px;margin-bottom:3px;}
.notif-pts{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:#EF4444;}
.notif-fulfill{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;margin-top:7px;font-family:'DM Sans',sans-serif;}
.notif-fulfill:hover{background:var(--surface);color:var(--text);}
.notif-fulfilled{font-size:11px;color:#10B981;margin-top:5px;}
.notif-clear{width:100%;padding:10px;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;}
.notif-clear:hover{background:var(--surface2);color:var(--text);}
#notif-overlay{position:fixed;inset:0;z-index:199;display:none;}
#notif-overlay.show{display:block;}

/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:11px 18px;font-size:13px;font-weight:500;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0;z-index:300;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast.ok{border-color:#10B981;color:#10B981;}
#toast.err{border-color:#EF4444;color:#EF4444;}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:400;font-family:'Syne',sans-serif;font-size:13px;color:var(--muted);letter-spacing:3px;}
.empty-state{text-align:center;padding:36px 0;color:var(--muted);font-size:13px;line-height:2;}
select{-webkit-appearance:auto;}
</style>
</head>
<body>

<div id="loading">🔥 KINDLING…</div>

<div id="splash" style="display:none;">
  <div class="splash-fire">🔥</div>
  <div class="splash-title">LDC 2026</div>
  <div class="splash-sub">Leadership Development Camp</div>
  <div class="splash-btns">
    <button class="splash-btn btn-leader" onclick="showGroupPick()">I'm a Group Leader</button>
    <button class="splash-btn btn-admin" onclick="showAdminLogin()">Admin</button>
  </div>
</div>

<div id="admin-login">
  <div class="login-card">
    <div class="login-title">🔐 Admin access</div>
    <div class="login-sub">Enter the admin password to continue</div>
    <input class="login-input" type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')tryLogin()"/>
    <button class="login-btn" onclick="tryLogin()">Sign in</button>
    <div class="login-err" id="login-err">Incorrect password. Try again.</div>
    <div class="back-link" onclick="backToSplash()">← Back</div>
  </div>
</div>

<div id="group-pick">
  <div class="splash-fire" style="font-size:36px">🔥</div>
  <div class="pick-title">Select your group</div>
  <div class="pick-sub">Choose the group you lead</div>
  <div class="pick-grid">
    <div class="pick-card" onclick="enterAsLeader('Obedience')"><div class="pick-dot" style="background:var(--ob-light);color:var(--ob-dark)">OB</div><div class="pick-name">Obedience</div></div>
    <div class="pick-card" onclick="enterAsLeader('Reverence')"><div class="pick-dot" style="background:var(--rv-light);color:var(--rv-dark)">RV</div><div class="pick-name">Reverence</div></div>
    <div class="pick-card" onclick="enterAsLeader('Self-Respect')"><div class="pick-dot" style="background:var(--sr-light);color:var(--sr-dark)">SR</div><div class="pick-name">Self-Respect</div></div>
    <div class="pick-card" onclick="enterAsLeader('Discipline')"><div class="pick-dot" style="background:var(--dc-light);color:var(--dc-dark)">DC</div><div class="pick-name">Discipline</div></div>
  </div>
  <div class="back-link" onclick="backToSplash()">← Back</div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-logo">LDC 2026 🔥</div>
    <div id="topbar-right" style="display:flex;align-items:center;gap:8px;margin-left:auto;">
      <span class="topbar-badge" id="topbar-badge"></span>
      <span class="topbar-pts" id="topbar-pts"></span>
      <div class="notif-bell" id="notif-bell" style="display:none;" onclick="toggleNotifPanel()">🛒<div class="notif-dot" id="notif-dot"></div></div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="pages" id="pages"></div>
</div>

<div id="notif-overlay" onclick="closeNotifPanel()"></div>
<div id="notif-panel">
  <div class="notif-header"><div class="notif-header-title">🛒 Purchase Requests</div><div class="notif-close" onclick="closeNotifPanel()">×</div></div>
  <div class="notif-list" id="notif-list"></div>
  <div style="padding:10px;"><button class="notif-clear" onclick="markAllFulfilled()">✓ Mark all as fulfilled</button></div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, get, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── INIT ──────────────────────────────────────────────────────────────────────
async function initDB(){
  const pSnap=await get(ref(db,'points'));
  if(!pSnap.exists()){const o={};GROUPS.forEach(g=>o[g.id]=0);await set(ref(db,'points'),o);}
  const sSnap=await get(ref(db,'store'));
  if(!sSnap.exists()){const o={};DEFAULT_STORE.forEach((x,i)=>o['item'+i]=x);await set(ref(db,'store'),o);}
}

function startListeners(){
  onValue(ref(db,'points'),s=>{livePoints=s.val()||{};renderCurrentPage();updateTopbar();});
  onValue(ref(db,'transactions'),s=>{const r=s.val()||{};liveTx=Object.values(r).sort((a,b)=>b.ts-a.ts);renderCurrentPage();});
  onValue(ref(db,'store'),s=>{const r=s.val()||{};liveStore=Object.entries(r).map(([k,v])=>({...v,_key:k}));renderCurrentPage();});
  onValue(ref(db,'bids'),s=>{liveBids=s.val()||{};renderCurrentPage();startBidTimers();});
  if(currentRole==='admin') onValue(ref(db,'purchaseNotifs'),s=>{livePurchaseNotifs=s.val()||{};renderNotifPanel();updateNotifDot();});
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
window.showGroupPick=()=>{document.getElementById('splash').style.display='none';document.getElementById('group-pick').style.display='flex';};
window.showAdminLogin=()=>{document.getElementById('splash').style.display='none';document.getElementById('admin-login').style.display='flex';};
window.backToSplash=()=>{['admin-login','group-pick'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('splash').style.display='flex';};
window.tryLogin=()=>{if(document.getElementById('pw-input').value===ADMIN_PASSWORD){currentRole='admin';myGroup=null;document.getElementById('admin-login').style.display='none';launchApp();}else{document.getElementById('login-err').style.display='block';}};
window.enterAsLeader=gid=>{currentRole='leader';myGroup=gid;document.getElementById('group-pick').style.display='none';launchApp();};

function launchApp(){
  buildTabs();
  if(currentRole==='admin') document.getElementById('notif-bell').style.display='flex';
  document.getElementById('app').style.display='flex';
  updateTopbar();
  showTab(currentRole==='admin'?'admin':'dashboard');
  startListeners();
}

function getGroupMeta(id){return GROUPS.find(g=>g.id===id)||GROUPS[0];}

function updateTopbar(){
  const badge=document.getElementById('topbar-badge'),pts=document.getElementById('topbar-pts');
  if(currentRole==='admin'){
    badge.textContent='ADMIN';badge.style.cssText='background:rgba(249,115,22,.2);color:#FB923C;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;';
    pts.textContent='';
  } else {
    const m=getGroupMeta(myGroup);
    badge.textContent=m.init;badge.style.cssText=`background:${m.light};color:${m.dark};padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;`;
    pts.textContent=(livePoints[myGroup]||0)+' pts';pts.style.color=m.color;
  }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
let activePage='';
function buildTabs(){
  const tabs=currentRole==='admin'
    ?[['admin','⚡Points'],['store-mgr','🛍Store'],['bidding-mgr','🔨Bids'],['dashboard','📊Stats'],['history','📜Log']]
    :[['dashboard','🏕Home'],['leaderboard','🏆Ranks'],['store','🛍Store'],['bidding','🔨Bid'],['history','📜Log']];
  document.getElementById('tabs').innerHTML=tabs.map(([id,l])=>`<div class="tab" id="tab-${id}" onclick="showTab('${id}')">${l}</div>`).join('');
}
window.showTab=id=>{
  activePage=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const t=document.getElementById('tab-'+id);if(t) t.classList.add('active');
  renderPage(id);
};
function renderCurrentPage(){if(activePage) renderPage(activePage);}
function renderPage(id){
  const pages=document.getElementById('pages');
  let html='';
  if(id==='dashboard')   html=renderDashboard();
  if(id==='leaderboard') html=renderLeaderboard();
  if(id==='store')       html=renderStore();
  if(id==='history')     html=renderHistory();
  if(id==='admin')       html=renderAdmin();
  if(id==='store-mgr')   html=renderStoreMgr();
  if(id==='bidding')     html=renderBidding();
  if(id==='bidding-mgr') html=renderBiddingMgr();
  pages.innerHTML=`<div class="page active">${html}</div>`;
  if(id==='store')       attachStoreBtns();
  if(id==='admin')       attachAdminForm();
  if(id==='store-mgr')   attachStoreMgrForm();
  if(id==='bidding')     attachBidForms();
  if(id==='bidding-mgr') attachBiddingMgrForms();
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDashboard(){
  const total=Object.values(livePoints).reduce((s,v)=>s+v,0);
  const purchases=liveTx.filter(t=>t.type==='purchase').length;
  const sorted=[...GROUPS].sort((a,b)=>(livePoints[b.id]||0)-(livePoints[a.id]||0));
  const max=Math.max(...GROUPS.map(g=>livePoints[g.id]||0),1);
  return `
  <div class="stat-row">
    <div class="stat-box"><div class="stat-val">${GROUPS.length}</div><div class="stat-lbl">Groups</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--gold)">${total.toLocaleString()}</div><div class="stat-lbl">Total pts</div></div>
    <div class="stat-box"><div class="stat-val">${purchases}</div><div class="stat-lbl">Purchases</div></div>
  </div>
  <div class="sec">Standings</div>
  ${sorted.map(g=>{
    const pts=livePoints[g.id]||0,pct=Math.round(pts/max*100),isMe=g.id===myGroup;
    return `<div class="grp-card" style="${isMe?`border-color:${g.color};box-shadow:0 0 10px ${g.color}22`:''}">
      <div class="grp-dot" style="background:${g.light};color:${g.dark}">${g.init}</div>
      <div class="grp-name">${g.id}${isMe?' <span style="font-size:10px;color:var(--muted)">(you)</span>':''}</div>
      <div class="grp-bar-wrap"><div class="grp-bar" style="width:${pct}%;background:${g.color}"></div></div>
      <div class="grp-pts" style="color:${g.color}">${pts.toLocaleString()}</div>
    </div>`;
  }).join('')}`;
}

// ── STORE ─────────────────────────────────────────────────────────────────────

  return `
  <div class="store-header">

    <div style="font-family:Syne,sans-serif;font-size:22px;font-weight:800;color:var(--gold)">${myPts} <span style="font-size:14px;color:var(--muted)">pts available</span></div>
  </div>
  <div class="sec">Rewards</div>
  <div class="store-grid">
  ${liveStore.map(item=>{
    const canBuy=myPts>=item.pts;
    return `<div class="store-card">
      <span class="s-emoji">${item.emoji}</span>
      <div class="s-name">${item.name}</div>
      <div class="s-desc">${item.desc||''}</div>
      <div class="s-footer">
        <span class="s-pts">${item.pts} pts</span>
        <button class="s-btn" data-name="${item.name}" data-pts="${item.pts}" data-emoji="${item.emoji}" ${!canBuy?'disabled':''}>Redeem</button>
      </div>
    </div>`;
  }).join('')}
  </div>`;

function attachStoreBtns(){
  document.querySelectorAll('.s-btn').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const pts=parseInt(btn.dataset.pts),name=btn.dataset.name,emoji=btn.dataset.emoji;
      const curPts=livePoints[myGroup]||0;
      if(curPts<pts){toast('Not enough points!',false);return;}
      await set(ref(db,'points/'+myGroup),curPts-pts);
      await push(ref(db,'transactions'),{group:myGroup,desc:`Store: ${name}`,pts:-pts,type:'purchase',ts:Date.now()});
      await push(ref(db,'purchaseNotifs'),{group:myGroup,item:name,emoji,pts,ts:Date.now(),fulfilled:false});
      toast(`${name} redeemed! Collect from admin 🎉`,true);
    });
  });
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function renderHistory(){
  const filtered=currentRole==='leader'?liveTx.filter(t=>t.group===myGroup):liveTx;
  if(!filtered.length) return `<div class="empty-state">🔥 No transactions yet</div>`;
  return filtered.map(t=>{
    const isPlus=t.pts>0,g=getGroupMeta(t.group),d=new Date(t.ts);
    const ts=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · '+d.toLocaleDateString([],{month:'short',day:'numeric'});
    return `<div class="tx-item">
      <div class="tx-icon ${isPlus?'tx-plus':'tx-minus'}">${isPlus?'＋':'−'}</div>
      <div class="tx-body"><div class="tx-desc">${t.desc}</div><div class="tx-grp" style="color:${g.color}">${t.group}</div></div>
      <div style="text-align:right"><div class="tx-amt" style="color:${isPlus?'#10B981':'#EF4444'}">${isPlus?'+':''}${t.pts}</div><div class="tx-time">${ts}</div></div>
    </div>`;
  }).join('');
}

function attachAdminForm(){
  document.getElementById('log-btn').addEventListener('click',async()=>{
    const gid=document.getElementById('a-group').value;
    const act=document.getElementById('a-activity').value.trim()||'Activity';
    const pts=parseInt(document.getElementById('a-pts').value)||0;
    const type=parseInt(document.getElementById('a-type').value);
    const delta=pts*type,cur=livePoints[gid]||0;
    await set(ref(db,'points/'+gid),Math.max(0,cur+delta));
    await push(ref(db,'transactions'),{group:gid,desc:act,pts:delta,type:'activity',ts:Date.now()});
    document.getElementById('a-activity').value='';
    toast(`${delta>0?'+':''}${delta} pts → ${gid}`,true);
  });
}

// ── BIDDING (leader view) ─────────────────────────────────────────────────────
function renderBidding(){
  const bidList=Object.entries(liveBids).sort((a,b)=>b[1].createdAt-a[1].createdAt);
  if(!bidList.length) return `<div class="empty-state">🔨 No auctions yet<br>Admin will start one soon!</div>`;
  const myPts=livePoints[myGroup]||0;
  return bidList.map(([key,bid])=>{
    const now=Date.now(),active=now<bid.endsAt&&!bid.settled;
    const bidsArr=bid.bids?Object.entries(bid.bids).map(([k,v])=>({...v,_key:k})).sort((a,b)=>b.amount-a.amount):[];
    const leader=bidsArr[0]||null;
    const myBid=bidsArr.find(b=>b.group===myGroup);
    const minBid=leader?leader.amount+1:bid.startPts;
    return `<div class="bid-item ${active?'active-bid':'ended'}">
      <div class="bid-top">
        <div class="bid-emoji">${bid.emoji||'🏆'}</div>
        <div class="bid-info"><div class="bid-name">${bid.name}</div><div class="bid-sub">${bid.desc||''} · Start: ${bid.startPts} pts</div></div>
        <div class="bid-status ${active?'bid-active':'bid-ended'}">${active?'🔴 LIVE':'ENDED'}</div>
      </div>
      ${active?`<div class="bid-timer" id="btimer-${key}">${formatTime(Math.max(0,bid.endsAt-now))}</div>`:''}
      ${bid.settled&&bid.winner?`<div class="bid-winner-banner">🏆 Winner: <strong>${bid.winner}</strong> · ${bid.winAmount} pts</div>`:''}
      ${bid.settled&&!bid.winner?`<div class="bid-winner-banner" style="color:var(--muted);background:transparent">No bids — no winner</div>`:''}
      <div class="bid-bids-list">
        ${bidsArr.length?bidsArr.map((b,i)=>{
          const gm=getGroupMeta(b.group);
          return `<div class="bid-row ${i===0?'leading':''}">
            <div class="bid-grp-dot" style="background:${gm.light};color:${gm.dark}">${gm.init}</div>
            <div class="bid-grp-name">${b.group}${b.group===myGroup?' (you)':''}</div>
            ${i===0?'<span style="font-size:13px">👑</span>':''}
            <div class="bid-grp-pts" style="color:${i===0?'var(--gold)':'var(--muted)'}">${b.amount} pts</div>
          </div>`;
        }).join(''):`<div style="font-size:12px;color:var(--muted);padding:6px 2px">No bids yet — be first!</div>`}
      </div>
      ${active?`
        <div class="bid-input-row">
          <input class="bid-input" type="number" id="bidinput-${key}" min="${minBid}" placeholder="Min ${minBid} pts" value="${myBid?myBid.amount+1:''}"/>
          <button class="bid-submit" data-key="${key}" data-startpts="${bid.startPts}" data-leadamt="${leader?leader.amount:bid.startPts-1}">Bid</button>
        </div>
        <div class="bid-hint">💡 Win = pay full bid. Lose = 50% refunded.</div>`:''}
    </div>`;
  }).join('');
}
function attachBidForms(){
  document.querySelectorAll('.bid-submit').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const key=btn.dataset.key,bid=liveBids[key];
      if(!bid||Date.now()>=bid.endsAt||bid.settled){toast('Auction has ended',false);return;}
      const leadAmt=parseInt(btn.dataset.leadamt)||parseInt(btn.dataset.startpts)-1;
      const input=document.getElementById('bidinput-'+key);
      const amount=parseInt(input.value)||0;
      if(amount<=leadAmt){toast(`Must bid more than ${leadAmt} pts`,false);return;}
      if(amount>(livePoints[myGroup]||0)){toast("Not enough points!",false);return;}
      // replace existing bid from this group
      const existingBids=bid.bids?Object.entries(bid.bids):[];
      const myExisting=existingBids.find(([k,v])=>v.group===myGroup);
      if(myExisting) await remove(ref(db,`bids/${key}/bids/${myExisting[0]}`));
      await push(ref(db,`bids/${key}/bids`),{group:myGroup,amount,ts:Date.now()});
      input.value='';
      toast(`Bid of ${amount} pts placed! 🔥`,true);
    });
  });
}

        <div class="bid-emoji">${bid.emoji||'🏆'}</div>
        <div class="bid-info"><div class="bid-name">${bid.name}</div><div class="bid-sub">${bidsArr.length} bid(s) · Start: ${bid.startPts} pts</div></div>
        <div class="bid-status ${active?'bid-active':'bid-ended'}">${active?'🔴 LIVE':'ENDED'}</div>
      </div>
      ${active?`<div class="bid-timer" id="btimer-${key}">${formatTime(Math.max(0,bid.endsAt-now))}</div>`:''}
      ${leader?`<div style="font-size:12px;color:var(--gold);margin-bottom:8px">👑 Leading: <strong>${leader.group}</strong> — ${leader.amount} pts</div>`:'<div style="font-size:12px;color:var(--muted);margin-bottom:8px">No bids yet</div>'}
      ${bid.settled?`<div class="bid-winner-banner">🏆 ${bid.winner?`Winner: ${bid.winner} (${bid.winAmount} pts)`:'No winner'}</div>`:''}
      ${!bid.settled?`<button class="log-btn" data-settle="${key}" style="background:linear-gradient(135deg,#EF4444,#DC2626);margin-top:4px;font-size:13px">End & settle now</button>`:''}
    </div>`;
  }).join('')}`;
}
function attachBiddingMgrForms(){
  document.getElementById('bid-create-btn').addEventListener('click',async()=>{
    const emoji=document.getElementById('bid-emoji').value.trim()||'🏆';
    const name=document.getElementById('bid-name').value.trim();
    const desc=document.getElementById('bid-desc').value.trim();
    const startPts=parseInt(document.getElementById('bid-startpts').value)||0;
    const mins=parseInt(document.getElementById('bid-duration').value)||0;
    if(!name){toast('Enter an item name',false);return;}
    if(!startPts){toast('Enter a starting bid',false);return;}
    if(!mins){toast('Enter duration in minutes',false);return;}
    await push(ref(db,'bids'),{emoji,name,desc,startPts,endsAt:Date.now()+(mins*60000),settled:false,createdAt:Date.now()});
    ['bid-emoji','bid-name','bid-desc','bid-startpts','bid-duration'].forEach(id=>document.getElementById(id).value='');
    toast(`Auction started for ${mins} min! 🔨`,true);
  });
  document.querySelectorAll('[data-settle]').forEach(btn=>{
    btn.addEventListener('click',async()=>settleAuction(btn.dataset.settle));
  });
}

// ── SETTLE AUCTION ────────────────────────────────────────────────────────────
async function settleAuction(key){
  const bid=liveBids[key];if(!bid||bid.settled) return;
  const bidsArr=bid.bids?Object.entries(bid.bids).map(([k,v])=>({...v,_key:k})).sort((a,b)=>b.amount-a.amount):[];
  if(!bidsArr.length){
    await update(ref(db,'bids/'+key),{settled:true,winner:null,winAmount:0});
    toast('Auction settled — no bids',true);return;
  }
  const winner=bidsArr[0];
  // Deduct full from winner
  const wCur=livePoints[winner.group]||0;
  await set(ref(db,'points/'+winner.group),Math.max(0,wCur-winner.amount));
  await push(ref(db,'transactions'),{group:winner.group,desc:`🏆 Auction win: ${bid.name}`,pts:-winner.amount,type:'bid-win',ts:Date.now()});
  // 50% refund to losers
  for(let i=1;i<bidsArr.length;i++){
    const loser=bidsArr[i];
    const refund=Math.floor(loser.amount*0.5);
    if(refund>0){
      const lCur=livePoints[loser.group]||0;
      await set(ref(db,'points/'+loser.group),lCur+refund);
      await push(ref(db,'transactions'),{group:loser.group,desc:`Auction refund (50%): ${bid.name}`,pts:refund,type:'bid-refund',ts:Date.now()});
    }
  }
  // Purchase notification for admin
  await push(ref(db,'purchaseNotifs'),{group:winner.group,item:`[AUCTION] ${bid.name}`,emoji:bid.emoji||'🏆',pts:winner.amount,ts:Date.now(),fulfilled:false});
  await update(ref(db,'bids/'+key),{settled:true,winner:winner.group,winAmount:winner.amount});
  toast(`🏆 ${winner.group} wins ${bid.name}!`,true);
}

// ── BID TIMERS ────────────────────────────────────────────────────────────────
function startBidTimers(){
  clearInterval(window._bidInterval);
  window._bidInterval=setInterval(async()=>{
    const now=Date.now();
    Object.entries(liveBids).forEach(([key,bid])=>{
      const el=document.getElementById('btimer-'+key);
      if(el) el.textContent=formatTime(Math.max(0,bid.endsAt-now));
      if(!bid.settled&&now>=bid.endsAt) settleAuction(key);
    });
  },1000);
}
function formatTime(ms){
  if(ms<=0) return '00:00';
  const s=Math.floor(ms/1000),m=Math.floor(s/60),sec=s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ── NOTIFICATIONS ─────────────────────────────────────────────────────────────
function renderNotifPanel(){
  const list=document.getElementById('notif-list');
  const notifs=Object.entries(livePurchaseNotifs).sort((a,b)=>b[1].ts-a[1].ts);
  if(!notifs.length){list.innerHTML='<div class="empty-state">No purchases yet</div>';return;}
  list.innerHTML=notifs.map(([key,n])=>{
    const g=getGroupMeta(n.group),d=new Date(n.ts);
    const ts=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · '+d.toLocaleDateString([],{month:'short',day:'numeric'});
    return `<div class="notif-item ${!n.fulfilled?'unread':''}">
      <div class="notif-item-top"><span class="notif-group" style="color:${g.color}">${n.group}</span><span class="notif-time">${ts}</span></div>
      <div class="notif-item-body">${n.emoji} <strong>${n.item}</strong></div>
      <div class="notif-pts">−${n.pts} pts</div>
      ${n.fulfilled?'<div class="notif-fulfilled">✓ Given</div>':`<button class="notif-fulfill" data-key="${key}">Mark as given ✓</button>`}
    </div>`;
  }).join('');
  document.querySelectorAll('.notif-fulfill').forEach(btn=>{
    btn.addEventListener('click',async()=>await update(ref(db,'purchaseNotifs/'+btn.dataset.key),{fulfilled:true}));
  });
}
function updateNotifDot(){
  const unread=Object.values(livePurchaseNotifs).some(n=>!n.fulfilled);
  const dot=document.getElementById('notif-dot');if(dot) dot.classList.toggle('show',unread);
}
window.toggleNotifPanel=()=>{document.getElementById('notif-panel').classList.toggle('open');document.getElementById('notif-overlay').classList.toggle('show');};
window.closeNotifPanel=()=>{document.getElementById('notif-panel').classList.remove('open');document.getElementById('notif-overlay').classList.remove('show');};
window.markAllFulfilled=async()=>{const u={};Object.keys(livePurchaseNotifs).forEach(k=>u[k+'/fulfilled']=true);await update(ref(db,'purchaseNotifs'),u);toast('All marked fulfilled',true);};

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg,ok){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show '+(ok?'ok':'err');
  clearTimeout(window._toastT);window._toastT=setTimeout(()=>el.classList.remove('show'),2800);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
initDB().then(()=>{document.getElementById('loading').style.display='none';document.getElementById('splash').style.display='flex';});
</script>
